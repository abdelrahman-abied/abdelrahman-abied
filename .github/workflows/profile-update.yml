name: Generate Profile Assets

on:
  schedule:
    - cron: '0 0 * * *'  # Once daily is plenty — Medium RSS lags anyway
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Update blog posts in README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@abied.abiad"
          max_post_count: 5
          commit_message: "chore: update blog posts"
          comment_tag_name: "BLOG-POST-LIST"

      - name: Commit snake animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          if git diff --cached --quiet; then
            echo "No snake changes"
            exit 0
          fi
          git commit -m "chore: update snake animation"
          git pull --rebase
          git push
