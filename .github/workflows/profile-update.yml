name: Generate Profile Assets

on:
  schedule:
    # Runs every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
  
# Grant the GITHUB_TOKEN permissions to write to the repository
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    name: Update Profile Assets
    steps:
      - uses: actions/checkout@v4

      # Generates the snake contribution graph
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # This line is crucial: it tells the action where to save the file
          outputs: |
            output/github-contribution-grid-snake.svg
            output/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Fetches your latest Medium articles
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://medium.com/feed/@abied.abiad"
          max_post_count: 5
          readme_path: "README.md"
          comment_tag_name: "BLOG-POST-LIST"

      # Commits the generated files back to your repository
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: update profile assets" || exit 0
          git push
